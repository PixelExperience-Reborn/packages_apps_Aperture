name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleDebug

    - name: Generate Android.bp
      shell: bash
      run: |
        ./gradlew app:generateBp
        if [[ -n "$(git status --porcelain)" ]]; then
          echo "::error::generateBp changed tracked generated Soong/library/license files"
          git status --short
          git diff --stat
          git diff -- app/libs/Android.bp | sed -n '1,180p'
          exit 1
        fi

    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
